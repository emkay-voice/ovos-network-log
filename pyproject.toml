[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ovos-network-log"
dynamic = ["version"]
description = "A network log for OpenVoiceOS: every request OVOS and its skills make – when, where, who asked – for ovos-skill-guardian and you to read"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Andreas Lorensen"}]
requires-python = ">=3.9"
keywords = ["ovos", "openvoiceos", "privacy", "network", "log", "emkay"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
bus = ["ovos-bus-client"]
test = ["pytest", "requests"]

[project.urls]
Homepage = "https://github.com/emkay-voice/ovos-network-log"
Format = "https://github.com/emkay-voice/emkay/blob/main/docs/network-log.md"
Guardian = "https://github.com/emkay-voice/ovos-skill-guardian"

[tool.hatch.version]
path = "ovos_network_log/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["ovos_network_log"]

# the start-up hook goes next to the packages, where Python reads .pth files
[tool.hatch.build.targets.wheel.force-include]
"ovos_network_log.pth" = "ovos_network_log.pth"
