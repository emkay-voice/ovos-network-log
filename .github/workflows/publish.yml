# Run the tests and build the wheel on every push; check that the wheel's
# start-up hook (ovos_network_log.pth) logs a request in a fresh environment;
# publish to PyPI when a version tag is pushed (vX.Y.Z, matching __version__).
# Publishing uses PyPI's trusted publishing (no token): the PyPI project must
# name this repo, this workflow and the "pypi" environment as its publisher.
name: Build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          pip install -q -e ".[test]"
          pytest -q tests
      - name: Build
        run: |
          pip install -q build
          python -m build
      - name: The start-up hook works from the wheel
        run: |
          unzip -l dist/*.whl | grep -q "ovos_network_log.pth"
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install -q dist/*.whl
          OVOS_NETWORK_LOG=1 OVOS_NETWORK_LOG_BUS=0 OVOS_NETWORK_LOG_FILE=/tmp/net.jsonl \
            /tmp/fresh/bin/python -c "
          import urllib.request, urllib.error
          try: urllib.request.urlopen('https://example.com/a/path?q=x', timeout=20).read()
          except urllib.error.HTTPError: pass   # a 404 is an answer too
          "
          cat /tmp/net.jsonl
          grep -q '"host": "example.com"' /tmp/net.jsonl
          ! grep -q "a/path" /tmp/net.jsonl
          # not an OVOS program, not forced on: nothing logged
          OVOS_NETWORK_LOG_BUS=0 OVOS_NETWORK_LOG_FILE=/tmp/none.jsonl \
            /tmp/fresh/bin/python -c "import urllib.request; urllib.request.urlopen('https://example.com', timeout=20).read()"
          test ! -e /tmp/none.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
